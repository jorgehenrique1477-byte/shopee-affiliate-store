<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ofertas Premium</title></head><body><div style="font-family:system-ui;text-align:center;padding:40px">Carregando vitrine…</div><script>
(async()=>{try{const u='https://raw.githubusercontent.com/jorgehenrique1477-byte/shopee-affiliate-store/main/.github/workflows/publicar-v5.yml';const y=await (await fetch(u,{cache:'no-store'})).text();const m=y.match(/PAYLOAD:\s*\|([\s\S]*?)- name: Escrever arquivos/);if(!m)throw Error('V5 não encontrada');const b=m[1].split(/\n/).map(x=>x.replace(/^\s+/,'').trim()).filter(Boolean).join('');const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(bin);w.close();const html=await new Response(ds.readable).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="font-family:system-ui;padding:40px;text-align:center"><h2>Erro ao carregar a vitrine</h2><p>'+String(e.message||e)+'</p></div>';console.error(e)}})();
</script></body></html>
