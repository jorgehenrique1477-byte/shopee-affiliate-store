<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel ADM — Ofertas Premium</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#171717;background:#f7f7f8}
button,input,select,textarea{font:inherit}button{cursor:pointer}
:root{--primary:#ee4d2d;--secondary:#ff7337;--dark:#171717;--muted:#737373;--border:#e7e7e7;--card:#fff}
.container{width:min(1180px,calc(100% - 32px));margin:auto}
.top{background:var(--dark);color:#fff;font-size:13px;padding:9px 0}.top .container{display:flex;justify-content:space-between}
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}.nav{height:72px;display:flex;align-items:center;gap:28px}
.logo{font-size:21px;font-weight:800;white-space:nowrap}.logo span{color:var(--primary)}
.navlinks{display:flex;gap:20px;flex:1}.navlinks button{border:0;background:none;color:#555;font-weight:600}.navlinks button:hover{color:var(--primary)}
.search{display:flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;width:min(320px,35vw)}.search input{border:0;outline:0;padding:11px 13px;width:100%}.search button{border:0;background:var(--primary);color:#fff;width:45px}
.hero{margin:28px 0;background:linear-gradient(120deg,#171717,#303030);color:#fff;border-radius:22px;min-height:300px;padding:42px;display:flex;align-items:center;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:var(--primary);right:-90px;top:-80px;opacity:.25}
.hero-content{position:relative;z-index:1;max-width:650px}.hero h1{font-size:42px;line-height:1.05;margin:0 0 14px}.hero p{font-size:17px;color:#ddd;max-width:560px}.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn-primary{background:var(--primary);color:#fff}.btn-light{background:#fff;color:#171717}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:30px 0 16px}.section-title h2{margin:0;font-size:24px}.section-title p{margin:5px 0 0;color:var(--muted)}
.categories{display:flex;gap:10px;overflow:auto;padding-bottom:5px}.cat{border:1px solid var(--border);background:#fff;border-radius:999px;padding:9px 15px;white-space:nowrap;font-weight:650}.cat.active,.cat:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.product{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.18s}.product:hover{transform:translateY(-3px);box-shadow:0 10px 30px #00000010}.pimg{height:210px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;overflow:hidden}.pimg img{width:100%;height:100%;object-fit:contain;padding:10px;cursor:zoom-in}.thumb{width:52px;height:42px;border-radius:7px;object-fit:contain;background:#eee}.lightbox{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:24px;z-index:200;cursor:zoom-out}.lightbox.show{display:flex}.lightbox img{max-width:95vw;max-height:92vh;width:auto;height:auto;object-fit:contain;border-radius:12px;box-shadow:0 20px 80px #0008}.lightbox .close{position:absolute;top:18px;right:20px;border:0;background:#fff;color:#111;border-radius:50%;width:42px;height:42px;font-size:22px;cursor:pointer}.pbody{padding:14px}.badge{display:inline-block;background:#fff0eb;color:var(--primary);font-size:11px;font-weight:800;padding:5px 8px;border-radius:7px}.product h3{font-size:15px;margin:9px 0 8px;line-height:1.35}.price{font-size:20px;font-weight:850}.old{text-decoration:line-through;color:#999;font-size:12px;margin-left:6px}.pbody .btn{width:100%;margin-top:12px}
.empty{padding:55px 20px;text-align:center;color:#777;background:#fff;border:1px dashed #ddd;border-radius:16px}
footer{margin-top:55px;background:#171717;color:#bbb;padding:35px 0}.footerrow{display:flex;justify-content:space-between;gap:20px}.footerrow strong{color:#fff}
.admin{display:none;min-height:100vh;background:#f4f5f7}.admin.show{display:block}.public.hide{display:none}.adminbar{background:#171717;color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between}.adminbody{display:flex;min-height:calc(100vh - 58px)}.side{width:235px;background:#fff;border-right:1px solid var(--border);padding:18px}.side button{width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:12px;margin:3px 0;color:#555;font-weight:650}.side button.active,.side button:hover{background:#fff0eb;color:var(--primary)}.main{padding:28px;width:100%;overflow:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}.stat small{color:#777}.stat b{display:block;font-size:28px;margin-top:8px}.panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel h2{font-size:19px;margin:0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 9px;border-bottom:1px solid var(--border);text-align:left;font-size:14px}.thumb{width:52px;height:42px;border-radius:7px;object-fit:cover;background:#eee}.actions{display:flex;gap:7px}.iconbtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px}.iconbtn.danger{color:#d22}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #ddd;border-radius:9px;padding:10px;outline:none}.field textarea{min-height:90px;resize:vertical}.login{min-height:100vh;display:none;align-items:center;justify-content:center;background:#f4f5f7;padding:20px}.login.show{display:flex}.loginbox{background:#fff;width:min(400px,100%);padding:30px;border-radius:18px;border:1px solid var(--border);box-shadow:0 20px 60px #0001}.loginbox h1{margin-top:0}.notice{font-size:12px;color:#777;margin-top:12px}.toast{position:fixed;right:20px;bottom:20px;background:#171717;color:#fff;padding:13px 17px;border-radius:10px;z-index:100;display:none}.toast.show{display:block}.modalback{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:90}.modalback.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h3{margin:0}.x{border:0;background:#eee;border-radius:8px;padding:7px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.navlinks{display:none}.search{width:220px}.hero h1{font-size:34px}}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.pimg{height:170px}.hero{padding:28px 22px;min-height:270px}.hero h1{font-size:30px}.top{display:none}.nav{height:62px}.logo{font-size:18px}.search{width:150px}.adminbody{display:block}.side{width:100%;display:flex;overflow:auto;gap:5px;padding:8px}.side button{white-space:nowrap;width:auto}.main{padding:15px}.formgrid{grid-template-columns:1fr}.footerrow{display:block}.cards{gap:8px}.stat b{font-size:22px}}

<div class="loginbox"><h1>Painel ADM</h1><p>Entre com sua conta do Supabase.</p><div class="field"><label>E-mail</label><input id="email" type="email" placeholder="seu@email.com" onkeydown="if(event.key==='Enter')login()"></div><div class="field" style="margin-top:10px"><label>Senha</label><input id="password" type="password" placeholder="Sua senha" onkeydown="if(event.key==='Enter')login()"></div><button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="login()">Entrar</button><div class="notice">Crie o usuário administrador em Supabase → Authentication → Users.</div><button class="btn" style="width:100%;margin-top:8px" onclick="showPublic()">Voltar à vitrine</button></div>

<div class="adminbar"><strong>Ofertas Premium — Painel ADM</strong><div style="display:flex;gap:8px;align-items:center"><a class="btn btn-light" href="../vitrine/index.html" style="text-decoration:none">Ver vitrine</a><button class="btn btn-light" onclick="logout()">Sair</button></div></div>

<div class="modalback" id="modalBack"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Produto</h3><button class="x" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const defaults={settings:{siteName:'Ofertas Premium Shopee',description:'As melhores ofertas selecionadas e verificadas para você economizar.',buttonText:'Ver na Shopee',footerText:'© 2026 Ofertas Premium. Todos os direitos reservados.',primaryColor:'#ee4d2d',logo:''},categories:[],products:[],banners:[]};
let db=structuredClone(defaults), editingId=null;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(v){return 'R$ '+Number(v||0).toFixed(2).replace('.',',')}
function showPublic(){location.href='../vitrine/index.html'}
function showLogin(){document.getElementById('admin').classList.remove('show');document.getElementById('login').classList.add('show')}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return toast('Informe e-mail e senha');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return toast(error.message);document.getElementById('login').classList.remove('show');document.getElementById('admin').classList.add('show');await loadData();adminPage('dashboard')}
async function logout(){await sb.auth.signOut();showLogin()}
async function loadData(){
 try{
  const [s,c,p,b]=await Promise.all([sb.from('site_settings').select('*').eq('id',1).maybeSingle(),sb.from('categories').select('*').order('sort_order'),sb.from('products').select('*').order('sort_order'),sb.from('banners').select('*').order('sort_order')]);
  const err=[s,c,p,b].find(x=>x.error);if(err)throw err.error;
  db.settings=s.data?{...defaults.settings,...s.data.data}:defaults.settings;db.categories=c.data||[];db.products=(p.data||[]).map(x=>({...x,affiliateLink:x.affiliate_link,oldPrice:x.old_price}));db.banners=b.data||[];
 }catch(e){console.error(e);toast('Erro ao carregar banco. Confira Supabase/RLS.')}
}
async function saveProduct(id){let catId=document.getElementById('f_cat').value,cat=db.categories.find(c=>c.id===catId);let data={name:document.getElementById('f_name').value.trim(),category:cat?.name||'',category_id:catId,price:Number(document.getElementById('f_price').value)||0,old_price:Number(document.getElementById('f_old').value)||0,image:document.getElementById('f_img').value.trim(),description:document.getElementById('f_desc').value.trim(),affiliate_link:document.getElementById('f_link').value.trim(),featured:document.getElementById('f_featured').checked,offer:document.getElementById('f_offer').checked,active:document.getElementById('f_active').checked,sort_order:Number(document.getElementById('f_order').value)||0};if(!data.name||!data.price||!data.affiliate_link||!data.image)return toast('Preencha nome, preço, link e imagem');let r=id?await sb.from('products').update(data).eq('id',id):await sb.from('products').insert(data);if(r.error)return toast(r.error.message);await loadData();closeModal();adminPage('produtos');toast('Produto salvo no Supabase')}
async function deleteProduct(id){if(!confirm('Excluir este produto?'))return;let r=await sb.from('products').delete().eq('id',id);if(r.error)return toast(r.error.message);await loadData();adminPage('produtos');toast('Produto excluído')}
async function toggleProduct(id,active){let r=await sb.from('products').update({active}).eq('id',id);if(r.error)return toast(r.error.message);await loadData();adminPage('produtos')}
function productsAdmin(m){m.innerHTML='<div class="panelhead"><div><h2>Produtos</h2><p style="color:#777">Alterações são salvas no banco online.</p></div><button class="btn btn-primary" onclick="editProduct(\'\')">+ Novo produto</button></div><div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Imagem</th><th>Produto</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+db.products.map(p=>`<tr><td><img class="thumb" src="${esc(p.image||'')}" onerror="this.style.display='none'"></td><td><b>${esc(p.name)}</b><br><small>${esc(p.category||'')}</small></td><td>${money(p.price)}</td><td>${p.active!==false?'Ativo':'Inativo'}</td><td class="actions"><button class="iconbtn" onclick="editProduct('${p.id}')">Editar</button><button class="iconbtn" onclick="toggleProduct('${p.id}',${p.active===false})">${p.active===false?'Ativar':'Desativar'}</button><button class="iconbtn danger" onclick="deleteProduct('${p.id}')">Excluir</button></td></tr>`).join('')+'</tbody></table></div></div>'}
function editProduct(id){let p=db.products.find(x=>x.id===id)||{name:'',price:'',old_price:'',image:'',description:'',category_id:db.categories[0]?.id||'',affiliate_link:'',featured:false,offer:false,active:true,sort_order:0};editingId=id;document.getElementById('modalTitle').textContent=id?'Editar produto':'Novo produto';document.getElementById('modalBody').innerHTML=`<div class="formgrid"><div class="field full"><label>Nome</label><input id="f_name" value="${esc(p.name)}"></div><div class="field"><label>Categoria</label><select id="f_cat">${db.categories.map(c=>`<option value="${c.id}" ${c.id===p.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Preço</label><input id="f_price" type="number" step="0.01" value="${p.price||''}"></div><div class="field"><label>Preço anterior</label><input id="f_old" type="number" step="0.01" value="${p.old_price||p.oldPrice||''}"></div><div class="field"><label>Ordem</label><input id="f_order" type="number" value="${p.sort_order||0}"></div><div class="field full"><label>URL da imagem</label><input id="f_img" value="${esc(p.image||'')}"></div><div class="field full"><label>Link de afiliado Shopee</label><input id="f_link" value="${esc(p.affiliate_link||p.affiliateLink||'')}"></div><div class="field full"><label>Descrição</label><textarea id="f_desc">${esc(p.description||'')}</textarea></div><div><label><input id="f_featured" type="checkbox" ${p.featured?'checked':''}> Destaque</label></div><div><label><input id="f_offer" type="checkbox" ${p.offer?'checked':''}> Oferta</label></div><div><label><input id="f_active" type="checkbox" ${p.active!==false?'checked':''}> Ativo</label></div></div><div style="display:flex;justify-content:flex-end;gap:9px;margin-top:18px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveProduct('${id}')">Salvar</button></div>`;document.getElementById('modalBack').classList.add('show')}
async function saveCategory(id){let name=document.getElementById('c_name').value.trim(),active=document.getElementById('c_active').checked,sort_order=Number(document.getElementById('c_order').value)||0;if(!name)return toast('Informe o nome');let r=id?await sb.from('categories').update({name,active,sort_order}).eq('id',id):await sb.from('categories').insert({name,active,sort_order});if(r.error)return toast(r.error.message);await loadData();closeModal();adminPage('categorias');toast('Categoria salva')}
async function deleteCategory(id){if(!confirm('Excluir categoria?'))return;let r=await sb.from('categories').delete().eq('id',id);if(r.error)return toast(r.error.message);await loadData();adminPage('categorias')}
function categoriesAdmin(m){m.innerHTML='<div class="panelhead"><h2>Categorias</h2><button class="btn btn-primary" onclick="editCategory(\'\')">+ Nova categoria</button></div><div class="panel"><table class="table"><thead><tr><th>Nome</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+db.categories.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.active!==false?'Ativa':'Inativa'}</td><td><button class="iconbtn" onclick="editCategory('${c.id}')">Editar</button> <button class="iconbtn danger" onclick="deleteCategory('${c.id}')">Excluir</button></td></tr>`).join('')+'</tbody></table></div>'}
function editCategory(id){let c=db.categories.find(x=>x.id===id)||{name:'',active:true,sort_order:0};document.getElementById('modalTitle').textContent=id?'Editar categoria':'Nova categoria';document.getElementById('modalBody').innerHTML=`<div class="formgrid"><div class="field full"><label>Nome</label><input id="c_name" value="${esc(c.name)}"></div><div class="field"><label>Ordem</label><input id="c_order" type="number" value="${c.sort_order||0}"></div><div><label><input id="c_active" type="checkbox" ${c.active!==false?'checked':''}> Ativa</label></div></div><div style="display:flex;justify-content:flex-end;gap:9px;margin-top:18px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveCategory('${id}')">Salvar</button></div>`;document.getElementById('modalBack').classList.add('show')}
async function saveBanner(id){let data={title:document.getElementById('b_title').value.trim(),subtitle:document.getElementById('b_sub').value.trim(),image:document.getElementById('b_img').value.trim(),link:document.getElementById('b_link').value.trim(),active:document.getElementById('b_active').checked,sort_order:Number(document.getElementById('b_order').value)||0};let r=id?await sb.from('banners').update(data).eq('id',id):await sb.from('banners').insert(data);if(r.error)return toast(r.error.message);await loadData();closeModal();adminPage('banners');toast('Banner salvo')}
async function deleteBanner(id){if(!confirm('Excluir banner?'))return;let r=await sb.from('banners').delete().eq('id',id);if(r.error)return toast(r.error.message);await loadData();adminPage('banners')}
function bannersAdmin(m){m.innerHTML='<div class="panelhead"><h2>Banners</h2><button class="btn btn-primary" onclick="editBanner(\'\')">+ Novo banner</button></div><div class="panel"><table class="table"><thead><tr><th>Título</th><th>Imagem</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+db.banners.map(b=>`<tr><td><b>${esc(b.title)}</b><br><small>${esc(b.subtitle||'')}</small></td><td>${b.image?`<img class="thumb" src="${esc(b.image)}">`:'—'}</td><td>${b.active?'Ativo':'Inativo'}</td><td><button class="iconbtn" onclick="editBanner('${b.id}')">Editar</button> <button class="iconbtn danger" onclick="deleteBanner('${b.id}')">Excluir</button></td></tr>`).join('')+'</tbody></table></div>'}
function editBanner(id){let b=db.banners.find(x=>x.id===id)||{title:'',subtitle:'',image:'',link:'https://shopee.com.br',active:true,sort_order:0};document.getElementById('modalTitle').textContent=id?'Editar banner':'Novo banner';document.getElementById('modalBody').innerHTML=`<div class="formgrid"><div class="field full"><label>Título</label><input id="b_title" value="${esc(b.title)}"></div><div class="field full"><label>Subtítulo</label><input id="b_sub" value="${esc(b.subtitle||'')}"></div><div class="field full"><label>URL da imagem</label><input id="b_img" value="${esc(b.image||'')}"></div><div class="field full"><label>Link</label><input id="b_link" value="${esc(b.link||'')}"></div><div class="field"><label>Ordem</label><input id="b_order" type="number" value="${b.sort_order||0}"></div><div><label><input id="b_active" type="checkbox" ${b.active!==false?'checked':''}> Ativo</label></div></div><div style="display:flex;justify-content:flex-end;gap:9px;margin-top:18px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveBanner('${id}')">Salvar banner</button></div>`;document.getElementById('modalBack').classList.add('show')}
async function saveConfig(){let data={siteName:document.getElementById('s_name').value.trim(),description:document.getElementById('s_desc').value.trim(),buttonText:document.getElementById('s_btn').value.trim(),primaryColor:document.getElementById('s_color').value,logo:document.getElementById('s_logo').value.trim(),footerText:document.getElementById('s_footer').value.trim()};let r=await sb.from('site_settings').upsert({id:1,data});if(r.error)return toast(r.error.message);await loadData();toast('Configurações salvas no Supabase')}
function configAdmin(m){m.innerHTML=`<h1>Configurações</h1><div class="panel"><div class="formgrid"><div class="field"><label>Nome do site</label><input id="s_name" value="${esc(db.settings.siteName)}"></div><div class="field"><label>Cor principal</label><input id="s_color" type="color" value="${esc(db.settings.primaryColor||'#ee4d2d')}" style="height:42px;width:100%"></div><div class="field full"><label>Descrição</label><textarea id="s_desc">${esc(db.settings.description)}</textarea></div><div class="field"><label>Texto dos botões</label><input id="s_btn" value="${esc(db.settings.buttonText)}"></div><div class="field"><label>URL do logotipo</label><input id="s_logo" value="${esc(db.settings.logo||'')}"></div><div class="field full"><label>Rodapé</label><input id="s_footer" value="${esc(db.settings.footerText)}"></div></div><button class="btn btn-primary" style="margin-top:18px" onclick="saveConfig()">Salvar configurações</button></div>`}
async function dashboard(m){let {data,error}=await sb.from('analytics_events').select('event_type,product_id,product_name,created_at').order('created_at',{ascending:false}).limit(1000);if(error){data=[]}let visits=data.filter(x=>x.event_type==='visit').length,clicks=data.filter(x=>x.event_type==='click').length; m.innerHTML=`<h1>Dashboard</h1><div class="cards"><div class="stat"><small>Visitas</small><b>${visits}</b></div><div class="stat"><small>Cliques Shopee</small><b>${clicks}</b></div><div class="stat"><small>Produtos</small><b>${db.products.length}</b></div><div class="stat"><small>Categorias</small><b>${db.categories.length}</b></div></div><div class="panel"><h2>Integração ativa</h2><p style="color:#666">Os produtos, categorias, banners e configurações estão no Supabase. A vitrine consulta o mesmo banco.</p></div>`}
async function adminPage(page){document.querySelectorAll('.side button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));const m=document.getElementById('adminMain');if(page==='dashboard')return dashboard(m);if(page==='produtos')return productsAdmin(m);if(page==='categorias')return categoriesAdmin(m);if(page==='banners')return bannersAdmin(m);if(page==='config')return configAdmin(m)}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
async function boot(){const {data}=await sb.auth.getSession();if(data.session){document.getElementById('login').classList.remove('show');document.getElementById('admin').classList.add('show');await loadData();adminPage('dashboard')}else showLogin()}
document.addEventListener('DOMContentLoaded',()=>boot());
</script></body></html>
