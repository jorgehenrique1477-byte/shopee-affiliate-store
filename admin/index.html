<div id="login" class="login show"><div class="loginbox"><div class="brand">Ofertas <span>Premium</span></div><h1 style="margin-top:22px">Painel administrativo</h1><p class="sub">Gerencie produtos, fotos, banners e categorias.</p><div class="field"><label>E-mail</label><input id="email" type="email" placeholder="seu@email.com"></div><div class="field"><label>Senha</label><input id="password" type="password" placeholder="Sua senha"></div><button class="btn btn-primary" style="width:100%;margin-top:5px" onclick="login()">Entrar no painel</button><p class="sub" style="font-size:12px;margin-top:12px">A autenticação continua sendo feita pelo Supabase.</p></div></div>

<div class="editorback" id="editorBack"><div class="editor"><div class="modalhead"><div><h2>Editor de imagem</h2><p class="sub">Ajuste a foto antes de salvar no produto.</p></div><button class="close" onclick="closeEditor()">×</button></div><div class="editorgrid"><div class="canvaswrap"><canvas id="canvas"></canvas></div><div class="controls"><div class="control"><label>Brilho <span id="vBright">0</span></label><input id="bright" type="range" min="-100" max="100" value="0"></div><div class="control"><label>Contraste <span id="vContrast">0</span></label><input id="contrast" type="range" min="-100" max="100" value="0"></div><div class="control"><label>Saturação <span id="vSat">0</span></label><input id="sat" type="range" min="-100" max="100" value="0"></div><div class="control"><label>Desfoque <span id="vBlur">0</span></label><input id="blur" type="range" min="0" max="8" value="0"></div><div class="control"><b style="font-size:12px">Transformar</b><div class="toolgrid" style="margin-top:8px"><button onclick="rotate(-90)">↶ Girar</button><button onclick="rotate(90)">↷ Girar</button><button onclick="flip('h')">↔ Espelhar</button><button onclick="flip('v')">↕ Espelhar</button><button onclick="resetEditor()">Resetar</button></div></div><div class="control"><b style="font-size:12px">Corte rápido</b><div class="ratios" style="margin-top:8px"><button onclick="crop(1)">1:1</button><button onclick="crop(.8)">4:5</button><button onclick="crop(1.7777778)">16:9</button><button onclick="crop(1.3333333)">4:3</button></div></div></div></div><div class="editorfoot"><button class="btn" onclick="closeEditor()">Cancelar</button><button class="btn btn-primary" onclick="applyEditor()">Aplicar edição</button></div></div></div>

<script>
const defaults={settings:{siteName:'Ofertas Premium Shopee',description:'As melhores ofertas selecionadas e verificadas para você economizar.',buttonText:'Ver na Shopee',footerText:'© 2026 Ofertas Premium. Todos os direitos reservados.',primaryColor:'#ee4d2d',logo:''},categories:[],products:[],banners:[]};let db=structuredClone(defaults),editingImages=[];
const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(v){return 'R$ '+Number(v||0).toFixed(2).replace('.',',')}function parseImages(p){let raw=p?.image||'';if(Array.isArray(p?.images)&&p.images.length)return p.images.filter(Boolean);if(typeof raw==='string'&&raw.trim().startsWith('[')){try{let a=JSON.parse(raw);if(Array.isArray(a))return a.filter(Boolean)}catch(e){}}return raw?[raw]:[]}
async function login(){let email=$('email').value.trim(),password=$('password').value;if(!email||!password)return toast('Informe e-mail e senha');let {error}=await sb.auth.signInWithPassword({email,password});if(error)return toast(error.message);$('login').classList.remove('show');$('app').classList.add('show');await loadData();page('dashboard')}async function logout(){await sb.auth.signOut();$('app').classList.remove('show');$('login').classList.add('show')}
async function loadData(){try{let [s,c,p,b]=await Promise.all([sb.from('site_settings').select('*').eq('id',1).maybeSingle(),sb.from('categories').select('*').order('sort_order'),sb.from('products').select('*').order('sort_order'),sb.from('banners').select('*').order('sort_order')]);let err=[s,c,p,b].find(x=>x.error);if(err)throw err.error;db.settings=s.data?{...defaults.settings,...s.data.data}:defaults.settings;db.categories=c.data||[];db.products=(p.data||[]).map(x=>({...x,oldPrice:x.old_price,affiliateLink:x.affiliate_link}));db.banners=b.data||[]}catch(e){console.error(e);toast('Erro ao carregar dados do Supabase')}}
function page(p){document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.page===p));let c=$('content');if(p==='dashboard')return dashboard(c);if(p==='produtos')return products(c);if(p==='categorias')return categories(c);if(p==='banners')return banners(c);if(p==='config')return config(c)}
async function dashboard(c){let r=await sb.from('analytics_events').select('event_type,product_name,created_at').order('created_at',{ascending:false}).limit(1000);let ev=r.data||[];let visits=ev.filter(x=>x.event_type==='visit').length,clicks=ev.filter(x=>x.event_type==='click').length;c.innerHTML=`<div class="pagehead"><div><h1>Dashboard</h1><p class="sub">Visão geral da sua vitrine.</p></div><button class="btn btn-primary" onclick="editProduct('')">+ Novo produto</button></div><div class="cards"><div class="stat"><small>Visitas registradas</small><b>${visits}</b></div><div class="stat"><small>Cliques na Shopee</small><b>${clicks}</b></div><div class="stat"><small>Produtos</small><b>${db.products.length}</b></div><div class="stat"><small>Categorias</small><b>${db.categories.length}</b></div></div><div class="panel"><h2>Banco online conectado</h2><p class="sub" style="margin-top:8px">Produtos, categorias, banners e configurações são compartilhados entre o ADM e a vitrine pelo Supabase.</p></div>`}
function products(c){c.innerHTML=`<div class="pagehead"><div><h1>Produtos</h1><p class="sub">Cadastre e organize seus produtos de afiliado.</p></div><button class="btn btn-primary" onclick="editProduct('')">+ Novo produto</button></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>Foto</th><th>Produto</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody>${db.products.map(p=>`<tr><td><img class="thumb" src="${esc(parseImages(p)[0]||'')}"></td><td><b>${esc(p.name)}</b><br><small>${esc(p.category||'')} ${parseImages(p).length>1?'· '+parseImages(p).length+' fotos':''}</small></td><td>${money(p.price)}</td><td>${p.active!==false?'Ativo':'Inativo'}</td><td><div class="actions"><button class="mini" onclick="editProduct('${p.id}')">Editar</button><button class="mini" onclick="toggleProduct('${p.id}',${p.active===false})">${p.active===false?'Ativar':'Desativar'}</button><button class="mini danger" onclick="deleteProduct('${p.id}')">Excluir</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum produto cadastrado.</td></tr>'}</tbody></table></div></div>`}
function renderPhotos(){let box=$('photos');if(!box)return;box.innerHTML=editingImages.length?editingImages.map((x,i)=>`<div class="photo ${i===0?'main':''}">${i===0?'<span class="badge">PRINCIPAL</span>':''}<img src="${esc(x)}"><div class="photo-actions"><button onclick="setMain(${i})">Principal</button><button onclick="openEditor(${i})">Editar</button><button onclick="removePhoto(${i})">Excluir</button></div></div>`).join(''):'<div style="grid-column:1/-1;text-align:center;color:#888;padding:16px">Nenhuma foto adicionada.</div>'}
function setMain(i){let x=editingImages.splice(i,1)[0];editingImages.unshift(x);renderPhotos()}function removePhoto(i){editingImages.splice(i,1);renderPhotos()}function addFiles(files){[...files].filter(f=>f.type.startsWith('image/')).forEach(f=>{let r=new FileReader();r.onload=()=>{editingImages.push(r.result);renderPhotos()};r.readAsDataURL(f)})}
function editProduct(id){let p=db.products.find(x=>x.id===id)||{name:'',category_id:db.categories[0]?.id||'',price:'',old_price:'',image:'',description:'',affiliate_link:'',featured:false,offer:false,active:true,sort_order:0};editingImages=parseImages(p);$('modalTitle').textContent=id?'Editar produto':'Novo produto';$('modalBody').innerHTML=`<div class="formgrid"><div class="field full"><label>Nome do produto *</label><input id="f_name" value="${esc(p.name)}"></div><div class="field"><label>Categoria</label><select id="f_cat">${db.categories.map(c=>`<option value="${esc(c.id)}" ${c.id===p.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Preço atual *</label><input id="f_price" type="number" step="0.01" value="${p.price||''}"></div><div class="field"><label>Preço anterior</label><input id="f_old" type="number" step="0.01" value="${p.old_price||p.oldPrice||''}"></div><div class="field"><label>Ordem</label><input id="f_order" type="number" value="${p.sort_order||0}"></div><div class="field full"><label>Fotos do produto</label><div class="photo-manager"><div class="photo-toolbar"><label class="btn btn-primary">+ Adicionar fotos<input hidden id="files" type="file" accept="image/*" multiple onchange="addFiles(this.files)"></label><button type="button" class="btn" onclick="toast('Use Ctrl+V para colar uma imagem')">Colar imagem</button></div><div class="drop" id="drop" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="event.preventDefault();this.classList.remove('drag');addFiles(event.dataTransfer.files)">Arraste imagens aqui ou use <b>Ctrl+V</b> para colar.<br><small>Você pode adicionar várias fotos e escolher a principal.</small></div><div id="photos" class="photos"></div></div></div><div class="field full"><label>Link de afiliado Shopee *</label><input id="f_link" value="${esc(p.affiliate_link||p.affiliateLink||'')}"></div><div class="field full"><label>Descrição detalhada</label><textarea id="f_desc">${esc(p.description||'')}</textarea></div><div class="full checks"><label><input id="f_featured" type="checkbox" ${p.featured?'checked':''}> Destaque</label><label><input id="f_offer" type="checkbox" ${p.offer?'checked':''}> Oferta</label><label><input id="f_active" type="checkbox" ${p.active!==false?'checked':''}> Ativo</label></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveProduct('${id}')">Salvar produto</button></div>`;renderPhotos();$('modalBack').classList.add('show')}
async function saveProduct(id){let catId=$('f_cat').value,cat=db.categories.find(c=>c.id===catId),imgs=editingImages.filter(Boolean);let data={name:$('f_name').value.trim(),category:cat?.name||'',category_id:catId,price:Number($('f_price').value)||0,old_price:Number($('f_old').value)||0,image:imgs.length>1?JSON.stringify(imgs):(imgs[0]||''),description:$('f_desc').value.trim(),affiliate_link:$('f_link').value.trim(),featured:$('f_featured').checked,offer:$('f_offer').checked,active:$('f_active').checked,sort_order:Number($('f_order').value)||0};if(!data.name||!data.price||!data.affiliate_link||!imgs.length)return toast('Preencha nome, preço, link e pelo menos uma foto');let r=id?await sb.from('products').update(data).eq('id',id):await sb.from('products').insert(data);if(r.error)return toast(r.error.message);await loadData();closeModal();page('produtos');toast('Produto salvo')}async function deleteProduct(id){if(!confirm('Excluir este produto?'))return;let r=await sb.from('products').delete().eq('id',id);if(r.error)return toast(r.error.message);await loadData();page('produtos');toast('Produto excluído')}async function toggleProduct(id,active){let r=await sb.from('products').update({active}).eq('id',id);if(r.error)return toast(r.error.message);await loadData();page('produtos')}
function categories(c){c.innerHTML=`<div class="pagehead"><div><h1>Categorias</h1><p class="sub">Organize a vitrine por nichos.</p></div><button class="btn btn-primary" onclick="editCategory('')">+ Nova categoria</button></div><div class="panel"><table><thead><tr><th>Nome</th><th>Status</th><th>Ações</th></tr></thead><tbody>${db.categories.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.active!==false?'Ativa':'Inativa'}</td><td><button class="mini" onclick="editCategory('${x.id}')">Editar</button> <button class="mini danger" onclick="deleteCategory('${x.id}')">Excluir</button></td></tr>`).join('')}</tbody></table></div>`}function editCategory(id){let x=db.categories.find(c=>c.id===id)||{name:'',active:true,sort_order:0};$('modalTitle').textContent=id?'Editar categoria':'Nova categoria';$('modalBody').innerHTML=`<div class="field"><label>Nome</label><input id="c_name" value="${esc(x.name)}"></div><div class="field"><label>Ordem</label><input id="c_order" type="number" value="${x.sort_order||0}"></div><label><input id="c_active" type="checkbox" ${x.active!==false?'checked':''}> Ativa</label><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn btn-primary" onclick="saveCategory('${id}')">Salvar</button></div>`;$('modalBack').classList.add('show')}async function saveCategory(id){let data={name:$('c_name').value.trim(),sort_order:Number($('c_order').value)||0,active:$('c_active').checked};if(!data.name)return toast('Informe o nome');let r=id?await sb.from('categories').update(data).eq('id',id):await sb.from('categories').insert(data);if(r.error)return toast(r.error.message);await loadData();closeModal();page('categorias');toast('Categoria salva')}async function deleteCategory(id){if(!confirm('Excluir categoria?'))return;let r=await sb.from('categories').delete().eq('id',id);if(r.error)return toast(r.error.message);await loadData();page('categorias')}
async function deleteBanner(id){
  if(!confirm('Excluir este banner?')) return;
  try{
    const banner=db.banners.find(x=>x.id===id);
    const r=await sb.from('banners').delete().eq('id',id);
    if(r.error) throw r.error;
    if(banner?.image && banner.image.includes('/storage/v1/object/public/site-media/')){
      const marker='/storage/v1/object/public/site-media/';
      const path=decodeURIComponent(banner.image.split(marker)[1].split('?')[0]);
      if(path) await sb.storage.from('site-media').remove([path]);
    }
    await loadData();
    page('banners');
    toast('Banner excluído');
  }catch(e){
    console.error(e);
    toast('Erro ao excluir banner: '+(e.message||'erro'));
  }
}
function banners(c){c.innerHTML=`<div class="pagehead"><div><h1>Banners</h1><p class="sub">Crie vários banners. Imagens passam automaticamente; vídeos ficam em loop até você avançar.</p></div><button class="btn btn-primary" onclick="editBanner('')">+ Novo banner</button></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>Mídia</th><th>Título</th><th>Tipo</th><th>Status</th><th>Ações</th></tr></thead><tbody>${db.banners.map(x=>`<tr><td>${x.image?(x.media_type==='video'?'<video class="thumb" src="'+esc(x.image)+'" muted></video>':'<img class="thumb" src="'+esc(x.image)+'">'):'—'}</td><td><b>${esc(x.title)}</b><br><small>${esc(x.subtitle||'')}</small></td><td>${x.media_type==='video'?'Vídeo':'Imagem'}</td><td>${x.active?'Ativo':'Inativo'}</td><td><div class="actions"><button class="mini" onclick="editBanner('${x.id}')">Editar</button><button class="mini danger" onclick="deleteBanner('${x.id}')">Excluir</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum banner cadastrado.</td></tr>'}</tbody></table></div></div>`}
function editBanner(id){let x=db.banners.find(b=>b.id===id)||{title:'',subtitle:'',image:'',link:'',active:true,sort_order:0,media_type:'image'};let type=x.media_type==='video'?'video':'image';$('modalTitle').textContent=id?'Editar banner':'Novo banner';$('modalBody').innerHTML=`<div class="field"><label>Título</label><input id="b_title" value="${esc(x.title)}"></div><div class="field"><label>Subtítulo</label><input id="b_sub" value="${esc(x.subtitle||'')}"></div><div class="field"><label>Tipo de mídia</label><select id="b_type" onchange="bannerTypeChanged()"><option value="image" ${type==='image'?'selected':''}>Imagem</option><option value="video" ${type==='video'?'selected':''}>Vídeo</option></select></div><div class="field full"><label>Mídia do banner</label><div class="uploadbox"><div class="uploadrow"><label class="btn btn-primary">📤 Enviar arquivo<input hidden id="bannerFile" type="file" accept="image/*,video/*" onchange="addBannerFiles(this.files)"></label><button type="button" class="btn" onclick="pasteBanner()">📋 Colar imagem</button><button type="button" class="btn" onclick="clearBannerMedia()">Remover</button></div><div class="drop" style="margin-top:10px" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="event.preventDefault();this.classList.remove('drag');addBannerFiles(event.dataTransfer.files)">Arraste uma imagem ou vídeo aqui.<br><small>Imagens também podem ser coladas com Ctrl+V.</small></div><div id="bannerPreview" class="media-preview"></div><input id="b_img" type="hidden" value="${esc(x.image||'')}"></div></div><div class="field"><label>Link ao clicar (opcional)</label><input id="b_link" value="${esc(x.link||'')}"></div><div class="field"><label>Ordem</label><input id="b_order" type="number" value="${x.sort_order||0}"></div><label><input id="b_active" type="checkbox" ${x.active!==false?'checked':''}> Ativo</label><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn btn-primary" onclick="saveBanner('${id}')">Salvar banner</button></div>`;bannerTypeChanged();$('modalBack').classList.add('show');if(x.image)renderBannerMedia(x.image,type)}
function bannerTypeChanged(){let t=$('b_type')?.value||'image';let f=$('bannerFile');if(f)f.accept=t==='video'?'video/*':'image/*';let img=$('b_img')?.value;if(img)renderBannerMedia(img,t)}
function renderBannerMedia(src,type){let box=$('bannerPreview');if(!box)return;box.innerHTML=type==='video'?`<video src="${esc(src)}" controls muted loop></video>`:`<img src="${esc(src)}">`}
function clearBannerMedia(){if($('b_img'))$('b_img').value='';if($('bannerPreview'))$('bannerPreview').innerHTML=''}
function readFileData(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function closeModal(){const m=$('modalBack');if(m)m.classList.remove('show')}
function compressImage(file,max=1800,quality=.82){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function uploadBannerMedia(file){const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`banners/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;const up=await sb.storage.from('site-media').upload(path,file,{upsert:false,contentType:file.type,cacheControl:'31536000'});if(up.error)throw up.error;const pub=sb.storage.from('site-media').getPublicUrl(path);return pub.data.publicUrl}
async function pasteBanner(){try{let items=await navigator.clipboard.read();for(let item of items){let t=item.types.find(x=>x.startsWith('image/'));if(t){let blob=await item.getType(t);await addBannerFiles([new File([blob],'pasted.png',{type:t})]);return}}toast('Não encontrei uma imagem na área de transferência')}catch(e){toast('Use Ctrl+V para colar a imagem')}}async function addBannerFiles(files){try{let f=[...files].find(x=>x.type.startsWith('image/')||x.type.startsWith('video/'));if(!f)return toast('Selecione uma imagem ou vídeo');let type=f.type.startsWith('video/')?'video':'image';if($('b_type'))$('b_type').value=type;toast('Enviando mídia...');let url=await uploadBannerMedia(f);$('b_img').value=url;renderBannerMedia(url,type);toast(type==='video'?'Vídeo carregado':'Banner carregado')}catch(e){console.error(e);toast('Não foi possível enviar a mídia: '+(e.message||'erro'))}}
async function saveBanner(id){try{const data={title:$('b_title').value.trim(),subtitle:$('b_sub').value.trim(),image:$('b_img').value.trim(),link:$('b_link').value.trim(),active:$('b_active').checked,sort_order:Number($('b_order').value)||0,media_type:$('b_type').value};if(!data.image)return toast('Adicione uma imagem ou vídeo ao banner');let r=id?await sb.from('banners').update(data).eq('id',id):await sb.from('banners').insert(data);if(r.error)throw r.error;await loadData();closeModal();page('banners');toast('Banner salvo com sucesso')}catch(e){console.error(e);toast('Erro ao salvar banner: '+(e.message||'erro'))}}
function applyTheme(){let dark=localStorage.getItem('adm_theme')==='dark';document.body.classList.toggle('dark',dark);if($('themeBtn'))$('themeBtn').textContent=dark?'☀ Claro':'☾ Escuro'}function toggleTheme(){let dark=document.body.classList.toggle('dark');localStorage.setItem('adm_theme',dark?'dark':'light');$('themeBtn').textContent=dark?'☀ Claro':'☾ Escuro'}applyTheme();document.addEventListener('paste',async e=>{if(!$('modalBack').classList.contains('show'))return;if($('b_img')&&document.activeElement&&['b_title','b_sub','b_link','b_order'].includes(document.activeElement.id)){}let files=[...(e.clipboardData?.items||[])].map(x=>x.getAsFile()).filter(f=>f&&f.type.startsWith('image/'));if(files.length&&$('bannerPreview')&&$('b_img')){let modalTitle=$('modalTitle').textContent.toLowerCase();if(modalTitle.includes('banner')){e.preventDefault();await addBannerFiles(files)}}});let ed={img:null,index:-1,rot:0,fh:false,fv:false,bright:0,contrast:0,sat:0,blur:0};function draw(){let c=$('canvas'),ctx=c.getContext('2d'),i=ed.img;if(!i)return;let a=((ed.rot%360)+360)%360,w=i.naturalWidth,h=i.naturalHeight;c.width=(a===90||a===270)?h:w;c.height=(a===90||a===270)?w:h;ctx.save();ctx.translate(c.width/2,c.height/2);ctx.rotate(a*Math.PI/180);ctx.scale(ed.fh?-1:1,ed.fv?-1:1);ctx.filter=`brightness(${100+ed.bright}%) contrast(${100+ed.contrast}%) saturate(${100+ed.sat}%) blur(${ed.blur}px)`;ctx.drawImage(i,-w/2,-h/2);ctx.restore();$('vBright').textContent=ed.bright;$('vContrast').textContent=ed.contrast;$('vSat').textContent=ed.sat;$('vBlur').textContent=ed.blur}function openEditor(index){let src=editingImages[index],i=new Image();ed={img:null,index,rot:0,fh:false,fv:false,bright:0,contrast:0,sat:0,blur:0};i.onload=()=>{ed.img=i;['bright','contrast','sat','blur'].forEach(x=>$(x).value=0);draw();$('editorBack').classList.add('show')};i.src=src}function closeEditor(){$('editorBack').classList.remove('show')}function rotate(x){ed.rot+=x;draw()}function flip(x){x==='h'?ed.fh=!ed.fh:ed.fv=!ed.fv;draw()}function resetEditor(){ed.rot=0;ed.fh=false;ed.fv=false;ed.bright=ed.contrast=ed.sat=ed.blur=0;['bright','contrast','sat','blur'].forEach(x=>$(x).value=0);draw()}function crop(ratio){let c=$('canvas'),w=c.width,h=c.height;if(w/h>ratio)w=Math.round(h*ratio);else h=Math.round(w/ratio);let x=Math.round((c.width-w)/2),y=Math.round((c.height-h)/2),tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;tmp.getContext('2d').drawImage(c,x,y,w,h,0,0,w,h);let i=new Image();i.onload=()=>{ed.img=i;ed.rot=0;ed.fh=ed.fv=false;draw()};i.src=tmp.toDataURL('image/jpeg',.92)}function applyEditor(){try{if(!ed.img||ed.index<0)return toast('Nenhuma foto selecionada');let source=$('canvas'),w=source.width,h=source.height;if(!w||!h)return toast('Canvas vazio');let data=source.toDataURL('image/jpeg',.82);if(!data||data==='data:,')return toast('Não foi possível gerar a imagem');editingImages[ed.index]=data;renderPhotos();closeEditor();toast('Edição aplicada. Agora clique em Salvar produto.')}catch(e){console.error(e);toast('Erro ao aplicar a edição: '+(e.message||'não foi possível gerar a imagem'))}}['bright','contrast','sat','blur'].forEach(id=>$(id).addEventListener('input',()=>{ed[id==='bright'?'bright':id==='contrast'?'contrast':id==='sat'?'sat':'blur']=Number($(id).value);draw()}));document.addEventListener('paste',e=>{if(!$('modalBack').classList.contains('show'))return;let files=[...(e.clipboardData?.items||[])].map(x=>x.getAsFile()).filter(f=>f&&f.type.startsWith('image/'));if(files.length&&$('photos')){e.preventDefault();addFiles(files);toast('Imagem colada')}});$('email').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeEditor()}});(async()=>{let {data}=await sb.auth.getSession();if(data.session){$('login').classList.remove('show');$('app').classList.add('show');await loadData();page('dashboard')}})();
