name: Publicar V5 da vitrine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar vitrine V5
        env:
          PAYLOAD: |
            
      - name: Escrever arquivos
        run: |
          printf '%s' "$PAYLOAD" | base64 -d | gzip -d > vitrine/index.html
          cp vitrine/index.html index.html
      - name: Commit da V5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vitrine/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Publica a versão V5 real da vitrine"
          git push